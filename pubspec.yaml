name: stockroom_app
description: Shoe inventory and sales app (Flutter front end for the Spring Boot inventory API).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: '>=0.19.0 <1.0.0'
  image_picker: ^1.1.2   # camera / gallery
  image: ^4.2.0          # pure-Dart resize + JPEG encode (works on every platform)
  encrypt: ^5.0.3         # AES for the password field the API expects

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
